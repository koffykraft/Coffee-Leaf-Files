name: Phase I Integrity Repair

on:
  push:
    branches:
      - buna-structural-repair
    paths:
      - scripts/phase1_apply.py
      - .github/workflows/phase1-apply.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: buna-structural-repair
      - name: Apply guarded Phase I transformations
        run: python3 scripts/phase1_apply.py
      - name: Show changed files
        run: git status --short
      - name: Commit Phase I repairs
        run: |
          git config user.name "koffykraft"
          git config user.email "info@koffykraft.com"
          git add index.html buna-culinary-concepts.html assets/vocab/icon-board.html vocab/*.html
          git diff --cached --quiet && exit 0
          git commit -m "Phase I: repair definite internal link defects"
          git push origin HEAD:buna-structural-repair
