name: Fix Door Two syntax separator
on:
  push:
    branches: [buna-complete-message-migration]
    paths:
      - 'scripts/fix_door2_comma.py'
      - '.github/workflows/fix-door2-comma.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: buna-complete-message-migration
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/fix_door2_comma.py
      - name: Commit correction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/buna-content.js
          git diff --cached --quiet && exit 0
          git commit -m "Fix Door Two content object separator"
          git push origin HEAD:buna-complete-message-migration
