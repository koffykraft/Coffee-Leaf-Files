name: Package 3 Apply

on:
  push:
    branches:
      - buna-structural-repair

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !startsWith(github.event.head_commit.message, 'Package 3 apply:') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/package3_apply.py
      - name: Commit Package 3
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "koffykraft"
          git config user.email "info@koffykraft.com"
          git add '*.html' 'vocab/*.html' 'assets/vocab/*.html'
          git commit -m "Package 3 apply: classify and surface hidden resources"
          git push
