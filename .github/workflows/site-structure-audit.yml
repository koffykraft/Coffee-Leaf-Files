name: Site Structure Audit

on:
  push:
    branches:
      - audit-site-structure-20260903

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run audit
        run: python3 scripts/audit_site.py

      - name: Show Markdown report
        run: cat audit-output/site-audit.md

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: buna-site-structure-audit
          path: audit-output/
