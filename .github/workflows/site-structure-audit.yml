name: Buna Structural Repair Examinations

on:
  push:
    branches:
      - buna-structural-repair
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  examination-1-full-structural:
    name: Examination 1 - Full structural audit
    runs-on: ubuntu-latest
    steps:
      - name: Fresh checkout
        uses: actions/checkout@v4
      - name: Run full-site audit
        run: python3 scripts/audit_site.py
      - name: Show report
        run: cat audit-output/site-audit.md
      - name: Upload Examination 1 artifact
        uses: actions/upload-artifact@v4
        with:
          name: examination-1-full-structural-${{ github.sha }}
          path: audit-output/

  examination-2-independent-repeat:
    name: Examination 2 - Independent full repeat
    runs-on: ubuntu-latest
    steps:
      - name: Separate fresh checkout
        uses: actions/checkout@v4
      - name: Run full-site audit independently
        run: python3 scripts/audit_site.py
      - name: Show report
        run: cat audit-output/site-audit.md
      - name: Confirm mandatory hierarchy checklist exists
        run: test -f governance/BUNA_EXAMINATION_2_CHECKLIST.md
      - name: Upload Examination 2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: examination-2-independent-repeat-${{ github.sha }}
          path: audit-output/
