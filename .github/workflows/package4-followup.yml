name: Package 4 Follow-up

on:
  push:
    branches:
      - buna-structural-repair

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !startsWith(github.event.head_commit.message, 'Package 4 follow-up apply:') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/package4_followup.py
      - name: Commit Package 4 follow-up
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "koffykraft"
          git config user.email "info@koffykraft.com"
          git add citane-epsilon-board.html
          git commit -m "Package 4 follow-up apply: remove final legacy hosting URL"
          git push
