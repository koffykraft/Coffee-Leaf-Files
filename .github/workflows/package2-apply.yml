name: Package 2 Apply

on:
  push:
    branches:
      - buna-structural-repair

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !startsWith(github.event.head_commit.message, 'Package 2 apply:') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/package2_apply.py
      - name: Commit Package 2
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "koffykraft"
          git config user.email "info@koffykraft.com"
          git add '*.html'
          git commit -m "Package 2 apply: remove indirect routing and canonicalize legacy Foundation variants"
          git push
