name: Buna Preview Navigation Audit

on:
  push:
    branches:
      - main
      - fix-preview-navigation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  navigation-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Fresh checkout
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check preview-next/app.js
          node --check preview-next/router-fix.js
      - name: Run preview navigation regression audit
        run: python3 scripts/test_preview_navigation.py
