name: Package 1 Shell Apply

on:
  push:
    branches:
      - buna-structural-repair

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !startsWith(github.event.head_commit.message, 'Package 1 apply:') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Package 1 corrections
        run: python3 scripts/package1_shell_apply.py
      - name: Commit corrections
        run: |
          if git diff --quiet; then
            echo "No Package 1 changes required."
            exit 0
          fi
          git config user.name "koffykraft"
          git config user.email "info@koffykraft.com"
          git add catalogue.html index.html citane-terrain-map.html sensory-companion.html visitor-lounge.html
          git commit -m "Package 1 apply: correct site shell and stale text"
          git push
