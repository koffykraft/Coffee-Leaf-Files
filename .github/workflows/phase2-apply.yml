name: Phase II Hierarchy Repair

on:
  push:
    branches:
      - buna-structural-repair
    paths:
      - scripts/phase2_apply.py
      - .github/workflows/phase2-apply.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: buna-structural-repair
      - name: Apply guarded Phase II transformations
        run: python3 scripts/phase2_apply.py
      - name: Show changed files
        run: git status --short
      - name: Commit Phase II repairs
        run: |
          git config user.name "koffykraft"
          git config user.email "info@koffykraft.com"
          git add begin-with-a-cup.html index.html citane-logic-board.html
          git diff --cached --quiet && exit 0
          git commit -m "Phase II: repair canonical hierarchy entry routes"
          git push origin HEAD:buna-structural-repair
