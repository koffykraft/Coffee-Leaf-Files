name: Apply neutral public tone
on:
  push:
    branches: [buna-complete-message-migration]
    paths:
      - 'scripts/neutralize_public_tone.py'
      - '.github/workflows/neutral-tone-apply.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: buna-complete-message-migration
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/neutralize_public_tone.py
      - name: Commit migrated copy
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/buna-content.js
          git diff --cached --quiet && exit 0
          git commit -m "Neutralize public informational tone"
          git push origin HEAD:buna-complete-message-migration
