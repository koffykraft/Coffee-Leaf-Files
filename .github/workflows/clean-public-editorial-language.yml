name: Clean final public editorial language
on:
  push:
    branches: [buna-complete-message-migration]
    paths:
      - 'scripts/clean_public_editorial_language.py'
      - '.github/workflows/clean-public-editorial-language.yml'
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: buna-complete-message-migration
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/clean_public_editorial_language.py
      - name: Commit public copy cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/buna-content.js data/buna-claims.js
          git diff --cached --quiet && exit 0
          git commit -m "Remove internal and directive language from public copy"
          git push origin HEAD:buna-complete-message-migration
