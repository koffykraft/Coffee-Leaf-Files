name: Buna Next Preview Check
on:
  push:
    branches: [buna-next-preview]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: node --check preview-next/app.js
      - name: Preview file integrity
        run: |
          test -s preview-next/index.html
          test -s preview-next/styles.css
          grep -q 'Living traditions' preview-next/app.js
          grep -q 'Process Compass' preview-next/app.js
          grep -q 'Experimental Pathways' preview-next/app.js
