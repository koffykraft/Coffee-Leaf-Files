<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ask Buna — Coffee Leaf Guide</title><link rel="stylesheet" href="assets/buna-section.css"><style>.ask{max-width:760px;margin:auto;padding:34px 20px 70px}.ask textarea{width:100%;min-height:120px;padding:14px;border:1px solid #cfc5b6;background:#fffdf9;font:16px/1.5 Georgia,serif}.ask button{border:0;background:#2a3d2b;color:white;padding:12px 16px;margin:10px 8px 10px 0;cursor:pointer}.answer{white-space:pre-wrap;border-left:3px solid #4f6d51;padding:16px 18px;background:#f4f7f3;margin-top:20px}.results a{display:block;padding:9px 0;color:#4f6d51}.scope{font-size:.88rem;color:#68625d}</style></head><body class="buna-section"><header class="page-head"><div class="page-head__inner"><p class="eyebrow">Buna Guide</p><h1>Ask Buna</h1><p class="lead">Find your way through the library or ask about coffee-leaf traditions, processing, chemistry, sensory work, safety and research. This assistant is intentionally limited to Buna and coffee leaves.</p></div></header><main class="ask"><p class="scope" id="context"></p><textarea id="q" placeholder="Where does Buna discuss cinnamon-wood smoking?\nWhat recent coffee-leaf research concerns gut barrier function?"></textarea><div><button id="ask">Ask Buna</button><label class="scope"><input type="checkbox" id="external"> include recent external research search</label></div><div id="out"></div></main><script src="buna-nav.js"></script><script>const p=new URLSearchParams(location.search),from=p.get('from')||'';document.getElementById('context').textContent=from?'You arrived from: '+from:'';document.getElementById('ask').onclick=async()=>{const q=document.getElementById('q').value.trim(),out=document.getElementById('out');if(!q)return;out.innerHTML='<p>Looking through Buna…</p>';try{const r=await fetch('/api/guide',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:q,currentPage:from,externalResearch:document.getElementById('external').checked})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Unavailable');out.innerHTML='<div class="answer"></div><div class="results"></div>';out.querySelector('.answer').textContent=d.answer;const links=out.querySelector('.results');(d.pages||[]).slice(0,5).forEach(x=>{const a=document.createElement('a');a.href=x.url;a.textContent=x.title+' →';links.appendChild(a)})}catch(e){out.innerHTML='<div class="answer">'+e.message+'</div>'}};</script></body></html>
